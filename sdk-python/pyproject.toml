[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devpulse"
version = "0.1.0"
description = "Python SDK for the DevPulse Inline LLM Gateway."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "DevPulse" }]
keywords = ["llm", "openai", "anthropic", "ai-security", "ai-governance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25,<1",
]

[project.optional-dependencies]
openai = ["openai>=1.20.0"]
test = [
    "pytest>=7.4",
    "pytest-httpx>=0.30",
    "respx>=0.20",
]

[tool.setuptools.packages.find]
include = ["devpulse*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
devpulse = ["py.typed"]
